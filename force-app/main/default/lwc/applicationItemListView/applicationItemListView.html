<template>
    <lightning-card title="Application Item" icon-name="standard:service_appointment">
        <lightning-button label="New" slot="actions" onclick={handleNew}></lightning-button>
        
        <lightning-tabset variant="scoped">
            <!-- แท็บที่ 1: My Leave Request -->
            <lightning-tab label="My Leave Request">
                <div style="height: 300px;">
                    <lightning-datatable
                        key-field="Id"
                        data={leaveData}
                        columns={columns}
                        hide-checkbox-column="false"
                        onrowaction={handleRowAction}>
                    </lightning-datatable>
                </div>
            </lightning-tab>

            <!-- แท็บที่ 2: My LWOP Request -->
            <lightning-tab label="My LWOP Request">
                <div style="height: 300px;">
                    <lightning-datatable
                        key-field="Id"
                        data={lwopData}
                        columns={columns}
                        hide-checkbox-column="false"
                        onrowaction={handleRowAction}>
                    </lightning-datatable>
                </div>
            </lightning-tab>

            <!-- แท็บที่ 3: My OT Request -->
            <lightning-tab label="My OT Request">
                <div style="height: 300px;">
                    <lightning-datatable
                        key-field="Id"
                        data={otData}
                        columns={columns}
                        hide-checkbox-column="false"
                        onrowaction={handleRowAction}>
                    </lightning-datatable>
                </div>
            </lightning-tab>
        </lightning-tabset>

        <div class="slds-align_absolute-center slds-m-top_small slds-p-bottom_small">
            <a onclick={handleViewAll}>View All</a>
        </div>
    </lightning-card>

    <!-- ===================================== -->
    <!-- Edit Modal Section -->
    <!-- ===================================== -->
    <template if:true={isEditModalOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_small">
            <div class="slds-modal__container">
                <!-- Modal Header -->
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeEditModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 class="slds-text-heading_medium slds-hyphenate">Edit Application Item</h2>
                </header>

                <!-- Modal Body (Input Fields) -->
                <div class="slds-modal__content slds-p-around_medium">
                    <div class="slds-grid slds-wrap slds-gutters">
                        <div class="slds-col slds-size_1-of-2 slds-m-bottom_medium">
                            <lightning-input label="Start Date" type="date" value={editRecord.Term_From__c} data-field="Term_From__c" onchange={handleInputChange}></lightning-input>
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-m-bottom_medium">
                            <lightning-input label="End Date" type="date" value={editRecord.Term_To__c} data-field="Term_To__c" onchange={handleInputChange}></lightning-input>
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-m-bottom_medium">
                            <lightning-input label="Request Type" type="text" value={editRecord.Request_Type__c} data-field="Request_Type__c" onchange={handleInputChange}></lightning-input>
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-m-bottom_medium">
                            <lightning-input label="Period Leave" type="text" value={editRecord.Period_Leave__c} data-field="Period_Leave__c" onchange={handleInputChange}></lightning-input>
                        </div>
                        <div class="slds-col slds-size_2-of-2">
                            <lightning-textarea label="Remark" value={editRecord.Remark__c} data-field="Remark__c" onchange={handleInputChange}></lightning-textarea>
                        </div>
                    </div>
                </div>

                <!-- Modal Footer -->
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={closeEditModal} class="slds-m-right_x-small"></lightning-button>
                    <lightning-button label="Save" variant="brand" onclick={saveEditRecord}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
