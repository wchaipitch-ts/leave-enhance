<template>
    <!-- TOP SECTION: Employee Info & Highlight Cards -->
    <div class="slds-grid slds-grid_stretch slds-gutters_medium slds-m-bottom_medium">
        
        <!-- LEFT COLUMN: Employee Info -->
        <div class="slds-col slds-size_3-of-12 custom-employee-col">
            <div class="slds-box slds-theme_default custom-card-style" style="height: 100%;">
                <div class="slds-media slds-m-bottom_small">
                    <div class="slds-media__figure">
                        <span class="slds-avatar slds-avatar_circle" style="width:150px; height:150px;">
                            <img alt={employee.name} src={employee.photoUrl} title={employee.name} />
                        </span>
                    </div>
                    <div class="slds-media__body slds-p-left_small" style="padding-top: 1.2rem;">
                        <div class="slds-text-title_bold" style="font-size: 0.75rem; color: #000;">Name</div>
                            <div class="slds-m-bottom_x-small name-multiline-truncate" style="font-size: 0.8rem;">
                                    <a href={employee.userUrl} target="_blank">{employee.name}</a>
                            </div>
                        
                        <div class="slds-text-title_bold" style="font-size: 0.75rem; color: #000;">Employee Number</div>
                        <div class="slds-m-bottom_x-small text-blue" style="font-size: 0.8rem;">{employee.employeeNumber}</div>
                        
                        <div class="slds-text-title_bold" style="font-size: 0.75rem; color: #000;">Department</div>
                        <div class="slds-m-bottom_x-small text-blue" style="font-size: 0.8rem;">{employee.department}</div>
                        
                        <div class="slds-text-title_bold" style="font-size: 0.75rem; color: #000;">Start Date</div>
                        <div class="text-blue" style="font-size: 0.8rem;">{employee.startDate}</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- RIGHT COLUMN: Leave Balance Cards -->
        <div class="slds-col slds-size_9-of-12">
            <div class="slds-box slds-theme_default custom-card-style" style="height: 100%;">
                
                <!-- Header & Year Selector -->
                <div class="slds-grid slds-grid_align-spread slds-p-bottom_medium slds-m-bottom_medium" style="border-bottom: 1px solid #c9c9c9;">
                    <div>
                        <h2 class="slds-text-heading_medium slds-text-title_bold" style="color: #000;">Leave Balance</h2>
                        <p class="slds-text-body_small" style="color: #747474;">Overview of your leave entitlements and balances</p>
                    </div>
                    <div style="width: 120px;">
                        <lightning-combobox
                            name="yearSelector"
                            value={selectedYearString}
                            options={yearOptions}
                            onchange={handleYearChange}
                            variant="label-hidden"
                            class="year-dropdown">
                        </lightning-combobox>
                    </div>
                </div>

                <!-- 4 Highlight Cards Rendered via Loop -->
                <div class="slds-grid slds-gutters_small">
                    <template for:each={highlightCards} for:item="card">
                        <div key={card.leaveType} class="slds-col slds-size_1-of-4">
                            <div class={card.cssClass}>
                                <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                                    <div class="slds-col slds-text-title_bold slds-p-right_xx-small" style="font-size: 0.75rem; color: #000; white-space: pre-wrap; width: 45%;">
                                        {card.leaveType}
                                    </div>
                                    
                                    <div class={card.bubbleCssClass} style="padding: 10px; border-radius: 8px; width: 55%;">
                                        <div style="font-size: 0.65rem; color: #747474;">Available</div>
                                        <div class={card.numberCssClass} style="font-size: 2.5rem; line-height: 1; font-weight: 700;">{card.available}</div>
                                        <div class={card.numberCssClass} style="font-size: 0.75rem; font-weight: 700;">Days</div>
                                        <div style="font-size: 0.65rem; color: #747474;">Of {card.entitlement} Days</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>

            </div>
        </div>
    </div>

    <!-- MIDDLE SECTION: Application Item Datatables -->
    <div class="slds-m-bottom_medium">
        <template if:true={receivedUserId}>
            <c-application-item-list-view 
                target-user-id={receivedUserId}
                target-year={receivedYear}
                leave-balances={tableData}>
            </c-application-item-list-view>
        </template>
    </div>

    <!-- BOTTOM SECTION: Full Summary Table (Fixed: Auto-height container) -->
    <div class="slds-box slds-theme_default custom-card-style">
        <h2 class="slds-text-heading_small slds-text-title_bold slds-m-bottom_medium" style="color: #000;">Leave Balance Summary by Leave Type</h2>
        <lightning-datatable
            key-field="leaveType"
            data={tableData}
            columns={columns}
            hide-checkbox-column="true"
            resize-column-disabled="true">
        </lightning-datatable>
    </div>
</template>
