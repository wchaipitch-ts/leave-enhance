<template>
  <template if:true={available}>
    <lightning-card title="Leave Migration" icon-name="utility:sequence">
        <span slot="actions" class={orgBadgeClass}>{orgBadge}</span>

        <div class="slds-p-horizontal_medium">
            <div class="slds-box slds-theme_shade slds-m-bottom_medium slds-text-body_small">
                The six cutover steps, <strong>in order</strong>. 01 and 02 fix the User fields
                that 03 seeds from; 04, 05 and 06 correct what 03 produced. Every step previews
                before it can be applied, and a preview writes nothing.
            </div>

            <template if:true={context.confirmationRequired}>
                <div class="slds-box slds-theme_error slds-m-bottom_medium">
                    <p><strong>This is not a sandbox.</strong> To apply any step you must type the
                    org name exactly as it appears here:
                    <span class="orgname">{context.orgName}</span></p>
                    <lightning-input label="Type the org name to enable Apply"
                                     value={confirmation} onchange={handleConfirmation}
                                     class="slds-m-top_x-small"></lightning-input>
                </div>
            </template>

            <div class="slds-grid slds-gutters slds-wrap slds-m-bottom_medium">
                <div class="slds-col slds-size_1-of-3">
                    <lightning-input type="number" label="Leave year being migrated"
                                     value={year} onchange={handleYear} step="1"></lightning-input>
                </div>
                <div class="slds-col slds-size_2-of-3 slds-align-bottom">
                    <lightning-button variant="neutral" icon-name="utility:download"
                                      label="Download a snapshot of the User leave fields first"
                                      onclick={handleSnapshot} disabled={busy}></lightning-button>
                </div>
            </div>

            <template if:true={error}>
                <div class="slds-box slds-theme_error slds-m-bottom_medium">{error}</div>
            </template>

            <template for:each={steps} for:item="s">
                <div key={s.step} class={s.boxClass}>
                    <div class="slds-grid slds-grid_align-spread slds-wrap">
                        <div class="slds-col">
                            <span class="stepno">{s.step}</span>
                            <span class="slds-text-heading_small">{s.title}</span>
                        </div>
                        <div class="slds-col slds-text-align_right">
                            <lightning-button variant="brand-outline" label="Preview"
                                              data-step={s.step} onclick={handlePreview}
                                              disabled={busy}
                                              class="slds-m-right_xx-small"></lightning-button>
                            <lightning-button variant="destructive" label="Apply"
                                              data-step={s.step} onclick={handleApply}
                                              disabled={s.applyDisabled}></lightning-button>
                        </div>
                    </div>

                    <template if:true={s.blockedReason}>
                        <div class="slds-box slds-theme_warning slds-m-top_x-small
                                    slds-text-body_small">{s.blockedReason}</div>
                    </template>

                    <template if:true={s.outcome}>
                        <div class={s.outcomeClass}>{s.outcome.summary}</div>
                        <template if:true={s.hasLines}>
                            <pre class="detail">{s.detail}</pre>
                        </template>
                    </template>
                </div>
            </template>

            <template if:true={busy}>
                <lightning-spinner alternative-text="Running" size="small"
                                   variant="brand"></lightning-spinner>
            </template>
        </div>
    </lightning-card>
  </template>
</template>
