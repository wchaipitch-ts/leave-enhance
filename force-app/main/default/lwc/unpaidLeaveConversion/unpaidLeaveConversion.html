<template>
    <!-- Errors are shown on their own: without the figures there is nothing to render. -->
    <template if:true={hasError}>
        <div class="slds-card slds-p-around_medium">
            <div class="slds-text-color_error">{error}</div>
        </div>
    </template>

    <!-- Ordinary leave has nothing to do with conversion, so no card at all. -->
    <template if:true={showsCard}>
        <article class="slds-card conversion-card">

            <header class="slds-card__header conversion-header">
                <div class="slds-grid slds-grid_align-spread slds-wrap slds-p-around_medium">
                    <div class="slds-media slds-media_center slds-no-space">
                        <div class="slds-media__figure">
                            <lightning-icon icon-name="standard:event" size="small"></lightning-icon>
                        </div>
                        <div class="slds-media__body">
                            <h2 class="slds-text-heading_small conversion-title">Unpaid Leave Conversion</h2>
                            <p class="slds-text-body_small slds-text-color_weak">
                                Convert these unpaid days to Annual leave, up to what the
                                employee's balance can pay for now.
                            </p>
                        </div>
                    </div>

                    <div class="slds-no-flex slds-grid conversion-actions">
                        <lightning-button
                            label="Convert to Paid Leave"
                            variant="brand-outline"
                            disabled={convertDisabled}
                            onclick={openConvertModal}
                            class="slds-m-right_x-small">
                        </lightning-button>
                        <lightning-button
                            label="Reject &amp; Revert"
                            variant="destructive-text"
                            disabled={revertDisabled}
                            onclick={openRevertModal}>
                        </lightning-button>
                    </div>
                </div>
            </header>

            <div class="slds-card__body slds-p-horizontal_medium slds-p-bottom_medium">
                <template if:true={busy}>
                    <lightning-spinner alternative-text="Working" size="small"></lightning-spinner>
                </template>

                <div class="slds-grid slds-wrap slds-gutters">
                    <template for:each={stats} for:item="stat">
                        <div key={stat.key} class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4">
                            <div class="slds-text-body_small slds-text-color_weak">{stat.label}</div>
                            <div class="stat-value">{stat.value}</div>
                        </div>
                    </template>
                </div>

                <!--
                    A Converted Days figure with no way to reach what it counts is a number
                    nobody can check. These are approved, paid records now, and the manager
                    who made them is the one most likely to want to look.
                -->
                <template if:true={hasConvertedRequests}>
                    <div class="slds-m-top_medium slds-border_top slds-p-top_small">
                        <div class="slds-text-title_caps slds-m-bottom_xx-small">Converted requests</div>
                        <template for:each={convertedRequests} for:item="made">
                            <div key={made.recordId} class="slds-grid slds-grid_align-spread slds-p-vertical_xx-small">
                                <a data-id={made.recordId} onclick={handleOpenRequest}>{made.name}</a>
                                <div class="slds-text-body_small">
                                    <lightning-formatted-number
                                        value={made.days}
                                        minimum-fraction-digits="2">
                                    </lightning-formatted-number>
                                    <span> days · </span>
                                    <span class="slds-text-color_success">{made.status}</span>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>

                <template if:true={blockedNote}>
                    <div class="slds-m-top_medium slds-text-body_small slds-text-color_weak">
                        <lightning-icon icon-name="utility:info" size="xx-small" class="slds-m-right_xx-small"></lightning-icon>
                        {blockedNote}
                    </div>
                </template>

                <template if:true={revertNote}>
                    <div class="slds-m-top_xx-small slds-text-body_small slds-text-color_weak">
                        <lightning-icon icon-name="utility:info" size="xx-small" class="slds-m-right_xx-small"></lightning-icon>
                        {revertNote}
                    </div>
                </template>
            </div>
        </article>
    </template>

    <!-- ============================================================ convert modal -->
    <template if:true={showConvertModal}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_small">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                            title="Close" onclick={closeConvertModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="close"
                                        variant="inverse" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 class="slds-text-heading_medium">Convert to Paid Leave</h2>
                </header>

                <div class="slds-modal__content slds-p-around_medium">
                    <p class="slds-m-bottom_small slds-text-body_small slds-text-color_weak">
                        {convertHelp}
                    </p>
                    <lightning-input
                        type="number"
                        label="Days to convert"
                        min="0.5"
                        step="0.5"
                        max={convertibleDays}
                        value={daysToConvert}
                        onchange={handleDaysChange}>
                    </lightning-input>
                    <p class="slds-m-top_small slds-text-body_small slds-text-color_weak">
                        The converted days become an approved Annual leave request and come
                        off the employee's Annual balance now. The earliest days convert
                        first, and half a day converts as a morning or an afternoon of its
                        own.
                    </p>
                </div>

                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={closeConvertModal}
                                      class="slds-m-right_x-small"></lightning-button>
                    <lightning-button label="Convert" variant="brand" disabled={busy}
                                      onclick={handleConvert}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- ============================================================= revert modal -->
    <template if:true={showRevertModal}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_small">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                            title="Close" onclick={closeRevertModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="close"
                                        variant="inverse" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 class="slds-text-heading_medium">Reject &amp; Revert</h2>
                </header>

                <div class="slds-modal__content slds-p-around_medium">
                    <p class="slds-m-bottom_small slds-text-body_small slds-text-color_weak">
                        {revertWarning}
                    </p>
                    <lightning-textarea
                        label="Reason"
                        required
                        value={revertReason}
                        onchange={handleReasonChange}>
                    </lightning-textarea>
                </div>

                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={closeRevertModal}
                                      class="slds-m-right_x-small"></lightning-button>
                    <lightning-button label="Reject &amp; Revert" variant="destructive" disabled={busy}
                                      onclick={handleRevert}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
