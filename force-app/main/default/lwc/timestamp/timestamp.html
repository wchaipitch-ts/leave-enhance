<template>
    <!-- Main Timestamp Card -->
    <lightning-card title="Timestamp" icon-name="standard:shift">
        
        <!-- Action Button: Open Timesheet -->
        <template if:true={currentPageUrl}>
            <a class="slds-button slds-button_neutral" href="/lightning/n/Timesheet" slot="actions">
                <lightning-icon icon-name="utility:new_window" size="xx-small"></lightning-icon>
                <span class="slds-m-left_x-small">Open TimeSheet</span>
            </a>
        </template>

        <!-- Loading Indicator -->
        <template if:false={loaded}>
            <lightning-spinner alternative-text="Loading"></lightning-spinner>
        </template>
        
        <div class="slds-card__body slds-card__body_inner">
            
            <!-- Dynamic Date Display -->
            <div class="date-text slds-p-bottom_medium slds-text-align_center">
                {todayString} ({weekString})
            </div>

            <!-- Responsive Flexbox Container for Clock and Buttons -->
            <div class="timestamp-container">
                
                <!-- Check-IN Button Area -->
                <div class="button-wrapper">
                    <template lwc:if={stampedIn}>
                        <button class="btn-rect btn-in-gray">IN</button>
                    </template>
                    <template lwc:else>
                        <button class="btn-rect btn-in" onclick={setTimeStampIn} style="width: 5rem;" data-id="in">IN</button>
                    </template>
                </div>

                <!-- Clock Display Area -->
                <div class="time-display">
                    <span class="time-text">{hours}</span>
                    <span class="time-text blink_me">{dotString}</span>
                    <span class="time-text">{minutes}</span>
                </div>

                <!-- Check-OUT Button Area -->
                <div class="button-wrapper">
                    <template lwc:if={stampedOut}>
                        <button class="btn-rect btn-out-gray">OUT</button>
                    </template>
                    <template lwc:else>
                        <button class="btn-rect btn-out" onclick={setTimeStampOut} style="width: 5rem;" data-id="out">OUT</button>
                    </template>
                </div>

            </div>
        </div>

        <!-- Home Screen Summary Details -->
        <template if:true={currentPageUrl}>
            <div class="slds-m-top_medium" style="display: flex; justify-content: center; align-items: center; color: #747474; font-size: 0.85rem;"> 
                <template if:true={stampedIn}>
                    <strong>IN :</strong> <span class="slds-m-left_xx-small">{timeIn}</span> &nbsp; &nbsp; &nbsp;
                </template>
                <template if:true={stampedOut}>
                    <strong>OUT :</strong> <span class="slds-m-left_xx-small">{timeOut}</span>
                </template>
            </div>
        </template>
    </lightning-card>

    <!-- Remarks Modal for Late/Overtime Scenarios -->
    <template if:true={isShowModal}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={hideModalBox}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 class="slds-text-heading_medium slds-hyphenate">{modalHeader}</h2>
                </header>
            
                <div class="slds-modal__content slds-p-around_medium">
                    <p>
                        <lightning-textarea 
                            label={remarkType} 
                            value={descriptionValue} 
                            required="true"
                            onchange={handleDescriptionChange}>
                        </lightning-textarea>
                    </p>
                </div>

                <footer class="slds-modal__footer">
                    <button class="slds-button slds-button_neutral" onclick={hideModalBox}>Cancel</button>
                    <lightning-button onclick={onSave} variant="brand" label="Save" class="slds-m-left_x-small"></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
