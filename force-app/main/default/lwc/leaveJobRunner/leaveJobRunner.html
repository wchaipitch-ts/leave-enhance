<template>
  <template if:true={available}>
    <lightning-card title="Leave Job Runner" icon-name="utility:play">
        <span slot="actions" class="slds-badge slds-badge_lightest">temporary &middot; sandbox only</span>

        <div class="slds-p-horizontal_medium">
            <div class="slds-box slds-theme_shade slds-m-bottom_medium slds-text-body_small">
                Runs the nightly grant job <em>as if</em> it were the date you pick, then shows what
                moved on one employee&rsquo;s balances. Use it for the dates nothing else reaches:
                <strong>1 January</strong> for the new year&rsquo;s rows and carry over,
                <strong>1 July</strong> for the carry-over sweep, and the <strong>1st of an
                anniversary month</strong> for a refreshment grant.
                <br /><br />
                The job always runs for <strong>every employee</strong>, not just the one you are
                watching. Preview first &mdash; it rolls everything back so you can see the effect
                without keeping it.
            </div>

            <div class="slds-box slds-theme_warning slds-m-bottom_medium slds-text-body_small">
                <strong>Every figure follows the date you pick</strong>, Accrued and Available
                included. They are stored figures now, and the run recalculates them as at the
                date you chose &mdash; so 1 January really does show you January.
                <br /><br />
                That is what makes a future-dated run worth trusting. Carry over is capped from
                the <em>prior</em> year&rsquo;s Available, and a year only reads its full
                entitlement once the date is past it. Leave the clock on today and every
                prior-year row still looks part-accrued, which quietly understates the carry over.
                <br /><br />
                <strong>Committing a future-dated run leaves those figures in the future</strong>
                until the nightly job re-settles them at 01:00. Preview unless you mean it.
                <br /><br />
                Two things worth knowing. Annual leave accrues monthly, but not on the same day for
                everybody: someone already in service gains their day on the <strong>1st</strong>,
                while someone who joined during the year earns theirs at <strong>month end</strong>.
                So a July joiner shows a full-year Entitlement against only a day or two Accrued
                &mdash; correct, not a bug. And a row built for a <em>future</em> leave year shows
                Accrued 0, which can make Available read as a negative once days are used against
                it.
            </div>

            <div class="slds-grid slds-gutters slds-wrap">
                <div class="slds-col slds-size_1-of-3">
                    <lightning-input type="date" label="Run the job as if it were"
                                     value={runDate} onchange={handleDate}
                                     date-style="short"></lightning-input>
                </div>
                <div class="slds-col slds-size_1-of-3">
                    <lightning-combobox label="Watch this employee" value={employeeId}
                                        options={employees} onchange={handleEmployee}
                                        placeholder="Pick an employee"></lightning-combobox>
                </div>
                <div class="slds-col slds-size_1-of-3">
                    <lightning-combobox label="Show balances for leave year" value={year}
                                        options={yearOptions} onchange={handleYear}
                                        field-level-help="Which year's balance rows to show. It does not change what the job does - that comes entirely from the date. It follows the date automatically; override it only if you want to watch a different year's rows."></lightning-combobox>
                    <template if:true={yearMismatch}>
                        <p class="slds-text-color_error slds-text-body_small slds-m-top_xx-small">
                            You are watching {year} but running as if it were {runYear}. A run
                            usually changes the rows for its own year, so this may report no
                            change even when it worked.
                        </p>
                    </template>
                </div>
            </div>

            <div class="slds-m-top_medium">
                <lightning-button variant="brand" label="Preview (nothing is saved)"
                                  onclick={handlePreview} disabled={busy}
                                  class="slds-m-right_x-small"></lightning-button>
                <lightning-button variant="destructive" label="Run for real"
                                  onclick={handleCommit} disabled={busy}></lightning-button>
                <lightning-button variant="base" label="Clear" onclick={handleClear}
                                  disabled={busy} class="slds-m-left_x-small"></lightning-button>
            </div>

            <template if:true={busy}>
                <div class="slds-m-top_medium"><lightning-spinner alternative-text="Running"
                     size="small" variant="brand"></lightning-spinner></div>
            </template>

            <template if:true={error}>
                <div class="slds-box slds-theme_error slds-m-top_medium">{error}</div>
            </template>

            <template if:true={result}>
                <div class={summaryClass}>{result.summary}</div>

                <table class="slds-table slds-table_bordered slds-table_cell-buffer slds-m-top_medium">
                    <thead>
                        <tr class="slds-line-height_reset">
                            <th scope="col"><div class="slds-truncate">Leave Type</div></th>
                            <template for:each={columns} for:item="col">
                                <th key={col} scope="col"><div class="slds-truncate">{col}</div></th>
                            </template>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={result.rows} for:item="row">
                            <tr key={row.leaveType} class={row.rowClass}>
                                <th scope="row">
                                    <div class="slds-truncate">
                                        {row.leaveType}
                                        <template if:true={row.isNew}>
                                            <span class="slds-badge slds-badge_inverse slds-m-left_x-small">new</span>
                                        </template>
                                    </div>
                                </th>
                                <template for:each={row.cells} for:item="cell">
                                    <td key={cell.label} class={cell.cellClass}>
                                        <div class="slds-truncate">{cell.value}</div>
                                    </td>
                                </template>
                            </tr>
                        </template>
                    </tbody>
                </table>

                <template if:false={hasRows}>
                    <div class="slds-box slds-theme_shade slds-m-top_small slds-text-body_small">
                        <strong>No balance rows exist for this employee in {result.year}.</strong>
                        The table is empty because there was nothing to compare, not because the
                        run failed. A year&rsquo;s rows are built by the <strong>1 January</strong>
                        grant and by nothing else &mdash; so pick 1 January {result.year}, press
                        <em>Run for real</em> to keep it, then come back to this date.
                    </div>
                </template>

                <template if:true={hasRows}>
                    <p class="slds-text-body_small slds-m-top_x-small slds-text-color_weak">
                        A cell reading <span class="moved">6 &rarr; 0</span> is one the run changed.
                        Rows with nothing highlighted were left alone.
                    </p>
                </template>
            </template>
        </div>
    </lightning-card>
  </template>
</template>
