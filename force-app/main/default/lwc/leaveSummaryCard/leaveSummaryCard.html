<template>
    <!-- Main Container -->
    <div class="slds-grid slds-grid_stretch slds-wrap" style="height: 100%;">
        
        <!-- ========================================== -->
        <!-- 🌟 Column 1: User Info & Monthly Hours -->
        <!-- Changed to size_4-of-12 to comfortably fit the 5rem padding -->
        <!-- Applied 'employee-info-box' class for the left padding -->
        <!-- ========================================== -->
        <div class="slds-col slds-size_1-of-1 slds-large-size_4-of-12 slds-border_right employee-info-box slds-grid slds-grid_vertical">
            
            <!-- 1.1 User Info -->
            <div class="slds-grid slds-m-bottom_small">
                <div class="slds-col slds-grow-none slds-m-right_medium">
                    <span class="slds-avatar slds-avatar_circle" style="width: 120px; height: 120px;">
                        <img alt={userName} src={userAvatar} title={userName} />
                    </span>
                </div>
                <!-- <div class="slds-col" style="font-size: 0.8rem; color: #000;"> -->
                    <div class="slds-col" style="font-size: 0.8rem; color: #000; padding-left: 0.5rem;">
                    <div class="slds-text-title_bold" style="font-size: 0.7rem;">Name</div>
                    <div class="slds-m-bottom_xx-small name-multiline">
                        <lightning-formatted-url value={userPath} tooltip={userName} label={userName} target="_blank"></lightning-formatted-url>
                    </div>
                    <!-- <div class="slds-m-bottom_xx-small slds-truncate">
                        <lightning-formatted-url value={userPath} tooltip={userName} label={userName} target="_blank"></lightning-formatted-url>
                    </div> -->
                    
                    <div class="slds-text-title_bold" style="font-size: 0.7rem;">Employee Number</div>
                    <div class="slds-m-bottom_xx-small slds-truncate text-blue">{employeeNumber}</div>
                    
                    <div class="slds-text-title_bold" style="font-size: 0.7rem;">Department</div>
                    <!-- Force text to stay on one line to match Figma -->
                    <div class="slds-m-bottom_xx-small text-blue" style="white-space: nowrap;">{userDepartment}</div>
                    
                    <div class="slds-text-title_bold" style="font-size: 0.7rem;">Start Date</div>
                    <div class="text-blue" style="white-space: nowrap;">{userStartDate}</div>
                </div>
            </div>

            <!-- Horizontal Divider -->
            <div class="slds-border_top slds-m-vertical_medium"></div>

           <!-- 1.2 Monthly Working Hours -->
<div class="slds-grid slds-p-top_small">
    
    <!-- 
      LEFT COLUMN: Standard Work & Total Hours
      Uses 'slds-grow-none' and 'slds-m-right_medium' to match the Avatar spacing above.
      The 'hours-left-col' class forces the width to exactly 75px. 
    -->
    <div class="slds-col slds-grow-none slds-m-right_medium hours-left-col">
        
        <div class="slds-m-bottom_medium">
            <div class="slds-text-title_bold" style="font-size: 0.7rem;">Standard Work</div>
            <div class="slds-m-bottom_xx-small slds-truncate text-blue">{standardWorkStr}</div>
        </div>
        
        <div>
            <div class="slds-text-title_bold" style="font-size: 0.7rem;">Total Hours</div>
            <div class="slds-m-bottom_xx-small slds-truncate text-blue">{totalHoursStr}</div>
        </div>
        
    </div>

    <!-- 
      RIGHT COLUMN: Worked Hours & Overtime Hours
      Uses standard 'slds-col' to flexibly take up the remaining space, 
      aligning perfectly with the User Info text above. 
    -->
    <!-- <div class="slds-col"> -->
        <div class="slds-col" style="padding-left: 3.2rem;"> <!-- Adjusted padding to align with the left column's content -->
        
        <div class="slds-m-bottom_medium">
            <div class="slds-text-title_bold" style="font-size: 0.7rem;">Worked Hours</div>
            <div class="slds-m-bottom_xx-small slds-truncate text-blue">{workedHoursStr}</div>
        </div>
        
        <div>
            <div class="slds-text-title_bold" style="font-size: 0.7rem;">Overtime Hours</div>
            <div class="slds-m-bottom_xx-small slds-truncate text-blue">{overtimeHoursStr}</div>
        </div>
        
    </div>

</div>
        </div>

        <!-- ========================================== -->
        <!-- 🌟 Column 2 & 3: Leave Balances -->
        <!-- Changed to size_8-of-12 to compensate for the larger left column -->
        <!-- ========================================== -->
        <div class="slds-col slds-size_1-of-1 slds-large-size_8-of-12 slds-p-vertical_medium">
            
            <div class="slds-grid slds-p-horizontal_medium slds-wrap" style="height: 100%; padding-top: 3rem;">
                
                <!-- ================= LEFT: ANNUAL LEAVE ================= -->
                <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2 slds-border_right slds-p-horizontal_medium slds-grid slds-grid_vertical" style="height: 100%;">
                    
                    <div class="slds-grow">
                        <div class="slds-grid slds-grid_align-spread slds-m-bottom_medium">
                            <div class="slds-col slds-text-heading_small">
                                <lightning-icon icon-name="standard:event" size="small" class="slds-m-right_x-small"></lightning-icon>
                                <b style="color: #000;">Annual Leave</b>
                            </div>
                            <div class="slds-col">
                                <button class="pill-btn pill-green" onclick={handleViewAnnualDetails}>View Details</button>
                            </div>
                        </div>

                        <div class="slds-grid">
                            <div class="slds-col slds-size_1-of-3 slds-text-align_center slds-border_right slds-p-right_small">
                                <div class="slds-m-bottom_xx-small text-gray" style="font-size: 0.8rem;">Available</div>
                                <template if:true={isOnProbation}>
                                    <div class="text-green big-number">0</div>
                                    <div class="text-green slds-text-title_bold slds-m-bottom_x-small">Days</div>
                                    <div class="text-red" style="font-size: 0.65rem; line-height:1;">Locked during probation</div>
                                </template>
                                <template if:false={isOnProbation}>
                                    <div class="text-green big-number">{annualLeave.availableDays}</div>
                                    <div class="text-green slds-text-title_bold slds-m-bottom_x-small">Days</div>
                                    <div class="text-gray" style="font-size: 0.75rem;">of {annualLeave.allocation} Days</div>
                                </template>
                            </div>
                            
                            <div class="slds-col slds-size_2-of-3 slds-p-left_medium">
                                <div class="slds-grid slds-wrap" style="color: #000; font-size: 0.75rem;">
                                    <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">Annual Allocation</div>
                                    <div class="slds-col slds-size_1-of-2 slds-text-align_right slds-p-bottom_small"><b>{annualLeave.allocation} Days</b></div>
                                    
                                    <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">Accrued to Date</div>
                                    <div class="slds-col slds-size_1-of-2 slds-text-align_right slds-p-bottom_small"><b><template if:true={isOnProbation}>0</template><template if:false={isOnProbation}>{annualLeave.accrued}</template> Days</b></div>
                                    
                                    <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">Used</div>
                                    <div class="slds-col slds-size_1-of-2 slds-text-align_right slds-p-bottom_small"><b><template if:true={isOnProbation}>0</template><template if:false={isOnProbation}>{annualLeave.used}</template> Days</b></div>
                                    
                                    <div class="slds-col slds-size_1-of-2">Carry-Over <span style="font-size:0.6rem;" class="text-gray"> <br>
                                        (From 2025)</span></div>
                                    <div class="slds-col slds-size_1-of-2 slds-text-align_right"><b><template if:true={isOnProbation}>0</template><template if:false={isOnProbation}>{annualLeave.carryOver}</template> Days</b></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Auto-Margin Footer -->
                    <div class="footer-align">
                        <template if:true={isOnProbation}>
                            <div class="warning-box">
                                <lightning-icon icon-name="utility:lock" size="x-small" class="slds-m-right_small"></lightning-icon>
                                <span>Annual Leave is not available during the probation period.
                                    Accrued leave will be available after successful
                                    completion of Probation.</span> 
                            </div>
                        </template>
                        <template if:false={isOnProbation}>
                            Year Period <span class="text-blue" style="font-weight: 600;">{annualLeave.period}</span>
                        </template>
                    </div>
                </div>

                <!-- ================= RIGHT: REFRESHMENT LEAVE ================= -->
                <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2 slds-p-horizontal_medium slds-grid slds-grid_vertical" style="height: 100%;">
                    
                    <div class="slds-grow">
                        <div class="slds-grid slds-grid_align-spread slds-m-bottom_medium">
                            <div class="slds-col slds-text-heading_small">
                               <lightning-icon 
                                    icon-name="utility:sync" 
                                    size="small" 
                                    class="slds-m-right_x-small blue-sync-icon">
                                </lightning-icon>
                                <b style="color: #000;">Refreshment Leave</b>
                            </div>
                            <div class="slds-col">
                                <button class="pill-btn pill-blue" onclick={handleViewRefreshmentDetails}>View Details</button>
                            </div>
                        </div>

                        <div class="slds-grid">
                            <div class="slds-col slds-size_1-of-3 slds-text-align_center slds-border_right slds-p-right_small">
                                <div class="slds-m-bottom_xx-small text-gray" style="font-size: 0.8rem;">Available</div>
                                <template if:true={isOnProbation}>
                                    <div class="text-blue big-number">0</div>
                                    <div class="text-blue slds-text-title_bold slds-m-bottom_x-small">Days</div>
                                    <div class="text-red" style="font-size: 0.65rem; line-height:1;">Not yet eligible</div>
                                </template>
                                <template if:false={isOnProbation}>
                                    <div class="text-blue big-number">{refreshmentLeave.availableDays}</div>
                                    <div class="text-blue slds-text-title_bold slds-m-bottom_x-small">Days</div>
                                    <div class="text-gray" style="font-size: 0.75rem;">of {refreshmentLeave.allocation} Days</div>
                                </template>
                            </div>
                            
                            <div class="slds-col slds-size_2-of-3 slds-p-left_medium">
                                <div class="slds-grid slds-wrap slds-m-top_small" style="color: #000; font-size: 0.75rem;">
                                    <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">Refreshment Allocation</div>
                                    <div class="slds-col slds-size_1-of-2 slds-text-align_right slds-p-bottom_small"><b><template if:true={isOnProbation}>0</template><template if:false={isOnProbation}>{refreshmentLeave.allocation}</template> Days</b></div>
                                    
                                    <div class="slds-col slds-size_1-of-2">Used</div>
                                    <div class="slds-col slds-size_1-of-2 slds-text-align_right"><b><template if:true={isOnProbation}>0</template><template if:false={isOnProbation}>{refreshmentLeave.used}</template> Days</b></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Auto-Margin Footer -->
                    <!-- Auto-Margin Footer -->
                    <div class="footer-align">
                        
                        <template if:true={isOnProbation}>
                            <!-- [FIX] Removed inline style. Added 'probation-spacing' class for independent CSS control -->
                            <div class="info-box probation-spacing">
                                <lightning-icon icon-name="utility:lock" size="x-small" class="slds-m-right_small"></lightning-icon>
                                <span>Refreshment Leave will be available on your next anniversary date.</span>
                            </div>
                        </template>
                        
                        <template if:false={isOnProbation}>
                            <!-- [FIX] Removed invalid style from <template> tag. Added 'standard-spacing' class to the inner div -->
                            <!-- <div class="standard-spacing"> -->
                            <div>
                                Next Refresh on <span class="text-blue" style="font-weight: 600;">{refreshmentLeave.nextRefresh}</span> 
                                (In {refreshmentLeave.daysUntilRefresh} Days)
                            </div>
                        </template>

                    </div>
                </div>

            </div> 
        </div> 
    </div> 
</template>
